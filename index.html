<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UE用語タイピング道場</title>
<style>
  :root{
    --bg:#12141a;
    --panel:#1a1d26;
    --panel2:#20242f;
    --border:#2c3040;
    --text:#e8eaf0;
    --sub:#8a90a4;
    --accent:#4ea1ff;
    --good:#5ee6a0;
    --bad:#ff5c6a;
    --warn:#ffcb6b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(circle at top, #1b1f2b 0%, #0e1015 70%);
    color:var(--text);
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    display:flex;
    justify-content:center;
    padding:24px 16px 60px;
    min-height:100%;
  }
  #app{
    width:100%;
    max-width:760px;
  }
  header{
    text-align:center;
    margin-bottom:20px;
  }
  header h1{
    font-size:1.5rem;
    margin:0 0 4px;
    letter-spacing:0.02em;
  }
  header p{
    margin:0;
    color:var(--sub);
    font-size:0.85rem;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  section[hidden]{display:none !important;}

  /* --- setup screen --- */
  .field{margin-bottom:22px;}
  .field > label.field-title{
    display:block;
    font-size:0.8rem;
    color:var(--sub);
    margin-bottom:8px;
    font-weight:600;
    letter-spacing:0.03em;
  }
  .mode-toggle{
    display:flex;
    gap:10px;
  }
  .mode-toggle label{
    flex:1;
    text-align:center;
    padding:12px 8px;
    border:1px solid var(--border);
    border-radius:10px;
    cursor:pointer;
    background:var(--panel2);
    transition:0.15s;
  }
  .mode-toggle input{display:none;}
  .mode-toggle label.active,
  .mode-toggle input:checked + span{color:var(--accent);}
  .mode-toggle label:has(input:checked){
    border-color:var(--accent);
    background:rgba(78,161,255,0.12);
    color:var(--accent);
  }
  .mode-toggle .desc{display:block;font-size:0.72rem;color:var(--sub);margin-top:2px;}

  .chip-group{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 12px;
    border:1px solid var(--border);
    border-radius:999px;
    background:var(--panel2);
    cursor:pointer;
    font-size:0.85rem;
    user-select:none;
    transition:0.15s;
  }
  .chip:has(input:checked){
    border-color:var(--accent);
    background:rgba(78,161,255,0.14);
  }
  .chip input{accent-color:var(--accent);}

  .toggle-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:0.88rem;
    color:var(--text);
  }
  .toggle-row input{accent-color:var(--accent);width:16px;height:16px;}

  .pool-info{
    margin-top:14px;
    font-size:0.82rem;
    color:var(--sub);
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 14px;
  }
  .pool-info b{color:var(--text);}
  .pool-info .warn{color:var(--warn);}

  .btn{
    display:inline-block;
    border:none;
    border-radius:10px;
    padding:12px 20px;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    transition:0.15s;
  }
  .btn-primary{
    background:linear-gradient(135deg,#4ea1ff,#7c6cff);
    color:#0b0d12;
    width:100%;
    padding:14px;
    font-size:1.05rem;
  }
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-primary:not(:disabled):hover{filter:brightness(1.08);}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--sub);
  }
  .btn-ghost:hover{color:var(--text);border-color:var(--sub);}
  .btn-small{padding:6px 12px;font-size:0.78rem;}

  .setup-footer{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }

  /* --- game screen --- */
  .game-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    font-size:0.85rem;
    color:var(--sub);
  }
  .progress-bar{
    flex:1;
    height:6px;
    background:var(--panel2);
    border-radius:99px;
    margin:0 14px;
    overflow:hidden;
  }
  .progress-bar > div{
    height:100%;
    background:linear-gradient(90deg,#4ea1ff,#7c6cff);
    width:0%;
    transition:width 0.25s;
  }
  .tag-row{
    display:flex;
    justify-content:center;
    margin-bottom:10px;
  }
  .tag{
    font-size:0.72rem;
    color:var(--sub);
    border:1px solid var(--border);
    padding:3px 10px;
    border-radius:999px;
    background:var(--panel2);
  }

  .q-area{
    text-align:center;
    padding:34px 10px 20px;
  }
  .meaning{
    font-size:clamp(1.15rem, 4.5vw, 1.7rem);
    font-weight:700;
    margin-bottom:8px;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .note-hint{
    font-size:0.82rem;
    color:var(--sub);
    min-height:1.2em;
    margin-bottom:26px;
    overflow-wrap:break-word;
    word-break:break-word;
  }

  .letters{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:4px;
    min-height:2.4em;
    max-width:100%;
  }
  .letter{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:1.05em;
    height:1.9rem;
    border-bottom:3px solid var(--border);
    font-family:"Consolas","SFMono-Regular",monospace;
    font-size:clamp(1.05rem, 4.5vw, 1.5rem);
    font-weight:600;
    color:var(--good);
    padding:0 2px;
    transition:border-color 0.15s;
  }
  .letter.space{border-bottom:none;min-width:0.7em;}
  .letter.active{border-color:var(--accent);}
  .letter.error{
    border-color:var(--bad);
    background:rgba(255,92,106,0.18);
    border-radius:4px;
    animation:shake 0.22s;
  }
  @keyframes shake{
    0%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    50%{transform:translateX(4px);}
    75%{transform:translateX(-3px);}
    100%{transform:translateX(0);}
  }

  .word-en{
    font-family:"Consolas","SFMono-Regular",monospace;
    font-size:clamp(1.3rem, 6vw, 2rem);
    font-weight:700;
    margin-bottom:30px;
    letter-spacing:0.02em;
    overflow-wrap:anywhere;
    word-break:break-word;
    max-width:100%;
  }
  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .choice-btn{
    padding:16px 12px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    font-size:1rem;
    cursor:pointer;
    transition:0.15s;
  }
  .choice-btn:hover:not(:disabled){border-color:var(--accent);}
  .choice-btn.correct{
    border-color:var(--good);
    background:rgba(94,230,160,0.16);
    color:var(--good);
  }
  .choice-btn.error{
    border-color:var(--bad);
    background:rgba(255,92,106,0.16);
    color:var(--bad);
    animation:shake 0.22s;
  }
  .choice-btn:disabled{cursor:not-allowed;}

  .hint-line{
    text-align:center;
    color:var(--sub);
    font-size:0.78rem;
    margin-top:24px;
  }

  .game-footer{
    margin-top:20px;
    text-align:center;
  }

  /* --- result screen --- */
  .result-stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:22px;
  }
  .stat-box{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 10px;
    text-align:center;
  }
  .stat-box .val{
    font-size:2rem;
    font-weight:700;
    color:var(--accent);
  }
  .stat-box .label{
    font-size:0.78rem;
    color:var(--sub);
    margin-top:4px;
  }
  .sub-stats{
    display:flex;
    justify-content:center;
    gap:20px;
    font-size:0.85rem;
    color:var(--sub);
    margin-bottom:22px;
  }
  .sub-stats b{color:var(--text);}

  .missed-section h3{
    font-size:0.85rem;
    color:var(--sub);
    margin:0 0 10px;
  }
  .missed-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:240px;
    overflow-y:auto;
    margin-bottom:22px;
  }
  .missed-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 14px;
    font-size:0.88rem;
  }
  .missed-item .en{font-family:"Consolas",monospace;font-weight:700;color:var(--bad);}
  .missed-item .ja{color:var(--sub);}
  .missed-empty{
    text-align:center;
    color:var(--sub);
    font-size:0.85rem;
    padding:16px 0 22px;
  }

  .result-footer{
    display:flex;
    gap:12px;
  }
  .result-footer .btn{flex:1;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>⌨ UE用語タイピング道場</h1>
    <p>Unreal Engine開発でよく使う英単語を、意味を見て身体で覚える</p>
  </header>

  <!-- ===== setup screen ===== -->
  <section id="screen-setup" class="card">
    <div class="field">
      <label class="field-title">モード</label>
      <div class="mode-toggle">
        <label id="mode-typing-label">
          <input type="radio" name="mode" value="typing" checked>
          <span>タイピングモード<span class="desc">意味を見て英単語を打つ</span></span>
        </label>
        <label id="mode-choice-label">
          <input type="radio" name="mode" value="choice">
          <span>4択モード<span class="desc">英単語を見て意味を選ぶ</span></span>
        </label>
      </div>
    </div>

    <div class="field">
      <label class="field-title">カテゴリ</label>
      <div class="chip-group" id="category-container"></div>
    </div>

    <div class="field">
      <label class="field-title">難易度</label>
      <div class="chip-group" id="level-container"></div>
    </div>

    <div class="field">
      <label class="toggle-row">
        <input type="checkbox" id="priority-checkbox" checked>
        苦手な単語を優先的に出題する
      </label>
    </div>

    <div class="pool-info" id="pool-info">読み込み中...</div>

    <div class="setup-footer">
      <button class="btn btn-ghost btn-small" id="reset-weak-btn" type="button">苦手リストをリセット</button>
      <button class="btn btn-primary" id="start-btn" type="button" disabled style="width:auto;flex:1;">はじめる</button>
    </div>
  </section>

  <!-- ===== game screen ===== -->
  <section id="screen-game" class="card" hidden>
    <div class="game-top">
      <button class="btn btn-ghost btn-small" id="quit-btn" type="button">✕ 中断</button>
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-text">1 / 10</span>
    </div>
    <div class="tag-row"><span class="tag" id="q-tag"></span></div>

    <!-- typing mode -->
    <div id="typing-area" class="q-area" hidden>
      <div class="meaning" id="q-meaning"></div>
      <div class="note-hint" id="q-note"></div>
      <div class="letters" id="letters"></div>
      <div class="hint-line">英単語をキーボードで入力してください(大文字・小文字は区別しません)</div>
    </div>

    <!-- choice mode -->
    <div id="choice-area" class="q-area" hidden>
      <div class="word-en" id="q-word-en"></div>
      <div class="choices" id="choices"></div>
      <div class="hint-line">正しい意味を選んでください</div>
    </div>
  </section>

  <!-- ===== result screen ===== -->
  <section id="screen-result" class="card" hidden>
    <div class="result-stats">
      <div class="stat-box">
        <div class="val" id="result-wpm">0</div>
        <div class="label" id="result-wpm-label">WPM</div>
      </div>
      <div class="stat-box">
        <div class="val" id="result-accuracy">0%</div>
        <div class="label">正答率</div>
      </div>
    </div>
    <div class="sub-stats">
      <div>正解 <b id="result-correct">0</b>問</div>
      <div>ミスあり <b id="result-missed">0</b>問</div>
      <div>所要時間 <b id="result-time">0:00</b></div>
    </div>

    <div class="missed-section">
      <h3>今回間違えた単語</h3>
      <div class="missed-list" id="missed-list"></div>
    </div>

    <div class="pool-info" id="weak-total-info"></div>

    <div class="result-footer" style="margin-top:20px;">
      <button class="btn btn-ghost" id="back-btn" type="button">設定に戻る</button>
      <button class="btn btn-primary" id="retry-btn" type="button">もう一度</button>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------
   * 単語データ(このファイルが唯一の正データ)
   * --------------------------------------------------------- */

    { "id": 154, "en": "Threshold", "ja": "閾値 / しきい値", "note": "処理が切り替わる境目の値。", "category": "共通", "level": 2 },
    { "id": 155, "en": "Interpolate", "ja": "補間する", "note": "2つの値の間をなめらかにつなぐこと。", "category": "共通", "level": 2 },
    { "id": 156, "en": "Clamp", "ja": "範囲内に収める", "note": "値を上限と下限の間に制限する処理。", "category": "共通", "level": 2 },
    { "id": 157, "en": "Normalize", "ja": "正規化する", "note": "ベクトルの長さを1にそろえること。", "category": "共通", "level": 2 },
    { "id": 158, "en": "Offset", "ja": "オフセット / ずらし量", "note": "基準からどれだけずらすかの差分。", "category": "共通", "level": 1 },
    { "id": 159, "en": "Persistent", "ja": "永続的な / 残り続ける", "note": "レベル遷移や終了をまたいで保持されること。", "category": "共通", "level": 2 },
    { "id": 160, "en": "Instanced", "ja": "インスタンス化された", "note": "個別に実体を持ち、それぞれ独立して編集できる状態。", "category": "UE固有", "level": 3 }
  ];

  const WEAK_KEY = "ueTypingTerms_weakWords_v1";
  const SET_SIZE = 10;

  let ALL_WORDS = [];
  let state = null; // active game state

  /* ---------- DOM refs ---------- */
  const screens = {
    setup: document.getElementById("screen-setup"),
    game: document.getElementById("screen-game"),
    result: document.getElementById("screen-result"),
  };
  const categoryContainer = document.getElementById("category-container");
  const levelContainer = document.getElementById("level-container");
  const priorityCheckbox = document.getElementById("priority-checkbox");
  const poolInfo = document.getElementById("pool-info");
  const startBtn = document.getElementById("start-btn");
  const resetWeakBtn = document.getElementById("reset-weak-btn");

  const quitBtn = document.getElementById("quit-btn");
  const progressFill = document.getElementById("progress-fill");
  const progressText = document.getElementById("progress-text");
  const qTag = document.getElementById("q-tag");
  const typingArea = document.getElementById("typing-area");
  const choiceArea = document.getElementById("choice-area");
  const qMeaning = document.getElementById("q-meaning");
  const qNote = document.getElementById("q-note");
  const lettersEl = document.getElementById("letters");
  const qWordEn = document.getElementById("q-word-en");
  const choicesEl = document.getElementById("choices");

  const resultWpm = document.getElementById("result-wpm");
  const resultWpmLabel = document.getElementById("result-wpm-label");
  const resultAccuracy = document.getElementById("result-accuracy");
  const resultCorrect = document.getElementById("result-correct");
  const resultMissed = document.getElementById("result-missed");
  const resultTime = document.getElementById("result-time");
  const missedList = document.getElementById("missed-list");
  const weakTotalInfo = document.getElementById("weak-total-info");
  const backBtn = document.getElementById("back-btn");
  const retryBtn = document.getElementById("retry-btn");

  /* ---------- utils ---------- */
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  function showScreen(name){
    Object.keys(screens).forEach(k=>{
      screens[k].hidden = (k!==name);
    });
  }
  function loadWeak(){
    try{
      const raw = localStorage.getItem(WEAK_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){
      return {};
    }
  }
  function saveWeak(obj){
    try{ localStorage.setItem(WEAK_KEY, JSON.stringify(obj)); }catch(e){ /* ignore quota errors */ }
  }
  function formatTime(sec){
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60);
    return m + ":" + String(s).padStart(2,"0");
  }

  /* ---------- setup screen ---------- */
  function getSelectedCategories(){
    return [...categoryContainer.querySelectorAll("input:checked")].map(i=>i.value);
  }
  function getSelectedLevels(){
    return [...levelContainer.querySelectorAll("input:checked")].map(i=>Number(i.value));
  }
  function getCurrentPool(){
    const cats = getSelectedCategories();
    const lvls = getSelectedLevels();
    return ALL_WORDS.filter(w=> cats.includes(w.category) && lvls.includes(w.level));
  }
  function buildFilterUI(){
    const cats = [...new Set(ALL_WORDS.map(w=>w.category))];
    const lvls = [...new Set(ALL_WORDS.map(w=>w.level))].sort((a,b)=>a-b);

    categoryContainer.innerHTML = cats.map(c=>
      `<label class="chip"><input type="checkbox" class="cat-check" value="${c}" checked>${c}</label>`
    ).join("");
    levelContainer.innerHTML = lvls.map(l=>
      `<label class="chip"><input type="checkbox" class="lvl-check" value="${l}" checked>Lv${l}</label>`
    ).join("");

    categoryContainer.addEventListener("change", updatePoolPreview);
    levelContainer.addEventListener("change", updatePoolPreview);
  }
  function updatePoolPreview(){
    const pool = getCurrentPool();
    const weak = loadWeak();
    const weakInPool = pool.filter(w=>weak[w.id]).length;
    if(pool.length===0){
      poolInfo.innerHTML = `<span class="warn">選択した条件に一致する単語がありません。カテゴリ/難易度を見直してください。</span>`;
      startBtn.disabled = true;
      return;
    }
    const setCount = Math.min(SET_SIZE, pool.length);
    poolInfo.innerHTML =
      `出題対象: <b>${pool.length}</b>語 (うち苦手 <b>${weakInPool}</b>語) / 1セット <b>${setCount}</b>問` +
      (pool.length < SET_SIZE ? `<br><span class="warn">対象が${SET_SIZE}語未満のため、今回は${setCount}問で出題します。</span>` : "");
    startBtn.disabled = false;
  }
  function resetWeakList(){
    if(!confirm("苦手リストをすべてリセットします。よろしいですか?")) return;
    saveWeak({});
    updatePoolPreview();
  }

  /* ---------- question set building ---------- */
  function buildQuestionSet(pool, weakMap, usePriority){
    let arr = shuffle(pool);
    if(usePriority){
      arr = arr
        .map((w,i)=>({w, weight:(weakMap[w.id]||0), rand:i}))
        .sort((a,b)=> b.weight - a.weight || a.rand - b.rand)
        .map(x=>x.w);
    }
    return arr.slice(0, Math.min(SET_SIZE, arr.length));
  }

  /* ---------- weak list update ---------- */
  function updateWeak(word, hadMistake){
    const weak = loadWeak();
    if(hadMistake){
      weak[word.id] = Math.min((weak[word.id]||0) + 1, 5);
    }else if(weak[word.id]){
      weak[word.id] -= 1;
      if(weak[word.id] <= 0) delete weak[word.id];
    }
    saveWeak(weak);
  }

  /* ---------- game flow ---------- */
  function startGame(){
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const pool = getCurrentPool();
    if(pool.length===0) return;
    const weak = loadWeak();
    const questions = buildQuestionSet(pool, weak, priorityCheckbox.checked);

    state = {
      mode,
      questions,
      index: 0,
      startTime: performance.now(),
      results: [],
      typedLen: 0,
      hadMistake: false,
    };

    showScreen("game");
    typingArea.hidden = (mode !== "typing");
    choiceArea.hidden = (mode !== "choice");
    if(mode === "typing"){
      document.addEventListener("keydown", onTypingKeyDown);
    }
    updateProgressUI();
    renderQuestion();
  }

  function updateProgressUI(){
    const total = state.questions.length;
    progressText.textContent = `${state.index+1} / ${total}`;
    progressFill.style.width = Math.round((state.index/total)*100) + "%";
  }

  function currentQuestion(){
    return state.questions[state.index];
  }

  function renderQuestion(){
    const q = currentQuestion();
    qTag.textContent = `${q.category} ・ Lv${q.level}`;
    state.hadMistake = false;

    if(state.mode === "typing"){
      state.typedLen = 0;
      qMeaning.textContent = q.ja;
      qNote.textContent = q.note || "";
      lettersEl.innerHTML = "";
      for(const ch of q.en){
        const span = document.createElement("span");
        span.className = "letter" + (ch===" " ? " space" : "");
        span.textContent = "";
        lettersEl.appendChild(span);
      }
      if(lettersEl.firstChild) lettersEl.firstChild.classList.add("active");
    }else{
      qWordEn.textContent = q.en;
      const distractors = pickDistractors(q, 3);
      const options = shuffle([q, ...distractors]);
      choicesEl.innerHTML = "";
      options.forEach(opt=>{
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.type = "button";
        btn.textContent = opt.ja;
        btn.addEventListener("click", ()=> onChoiceClick(btn, opt, q));
        choicesEl.appendChild(btn);
      });
    }
  }

  function pickDistractors(q, n){
    const pool = ALL_WORDS.filter(w=> w.id!==q.id && w.ja!==q.ja);
    const sameCat = shuffle(pool.filter(w=>w.category===q.category));
    const rest = shuffle(pool.filter(w=>w.category!==q.category));
    const combined = sameCat.concat(rest);
    const seen = new Set([q.ja]);
    const result = [];
    for(const w of combined){
      if(seen.has(w.ja)) continue;
      seen.add(w.ja);
      result.push(w);
      if(result.length>=n) break;
    }
    return result;
  }

  /* --- typing mode input --- */
  function onTypingKeyDown(e){
    if(!state || state.mode !== "typing") return;
    if(e.key.length !== 1) return; // ignore Shift, Enter, Backspace, etc.
    e.preventDefault();

    const q = currentQuestion();
    const expected = q.en[state.typedLen];
    const spans = lettersEl.children;

    if(e.key.toLowerCase() === expected.toLowerCase()){
      const span = spans[state.typedLen];
      span.textContent = expected === " " ? " " : expected;
      span.classList.remove("active");
      span.classList.add("correct");
      state.typedLen++;
      if(state.typedLen < q.en.length){
        spans[state.typedLen].classList.add("active");
      }else{
        document.removeEventListener("keydown", onTypingKeyDown);
        setTimeout(finishQuestion, 260);
      }
    }else{
      state.hadMistake = true;
      const span = spans[state.typedLen];
      span.classList.remove("error");
      // restart animation
      void span.offsetWidth;
      span.classList.add("error");
      setTimeout(()=> span.classList.remove("error"), 240);
    }
  }

  /* --- choice mode input --- */
  function onChoiceClick(btn, opt, q){
    if(btn.disabled) return;
    if(opt.id === q.id){
      btn.classList.add("correct");
      [...choicesEl.children].forEach(b=> b.disabled = true);
      setTimeout(finishQuestion, 350);
    }else{
      state.hadMistake = true;
      btn.classList.remove("error");
      void btn.offsetWidth;
      btn.classList.add("error");
      btn.disabled = true;
    }
  }

  function finishQuestion(){
    const q = currentQuestion();
    state.results.push({ id:q.id, en:q.en, ja:q.ja, hadMistake: state.hadMistake });
    updateWeak(q, state.hadMistake);
    state.index++;
    if(state.index >= state.questions.length){
      endGame();
    }else{
      updateProgressUI();
      renderQuestion();
      if(state.mode === "typing"){
        document.addEventListener("keydown", onTypingKeyDown);
      }
    }
  }

  function quitGame(){
    if(!confirm("この セットを中断して設定画面に戻ります。よろしいですか?")) return;
    document.removeEventListener("keydown", onTypingKeyDown);
    state = null;
    showScreen("setup");
    updatePoolPreview();
  }

  function endGame(){
    document.removeEventListener("keydown", onTypingKeyDown);
    const elapsedSec = (performance.now() - state.startTime) / 1000;
    const elapsedMin = elapsedSec / 60;
    const totalChars = state.questions.reduce((s,q)=> s + q.en.length, 0);
    const wpm = elapsedMin > 0 ? Math.round((totalChars/5)/elapsedMin) : 0;
    const correctCount = state.results.filter(r=>!r.hadMistake).length;
    const total = state.results.length;
    const accuracy = total>0 ? Math.round((correctCount/total)*1000)/10 : 0;
    const missed = state.results.filter(r=>r.hadMistake);

    resultWpm.textContent = wpm;
    resultWpmLabel.textContent = state.mode === "typing" ? "WPM" : "WPM (換算)";
    resultAccuracy.textContent = accuracy + "%";
    resultCorrect.textContent = correctCount;
    resultMissed.textContent = missed.length;
    resultTime.textContent = formatTime(elapsedSec);

    if(missed.length===0){
      missedList.innerHTML = "";
      missedList.hidden = true;
      const empty = document.createElement("div");
      empty.className = "missed-empty";
      empty.textContent = "ミスなし!パーフェクトです 🎉";
      missedList.parentNode.insertBefore(empty, missedList.nextSibling);
      missedList._emptyEl = empty;
    }else{
      if(missedList._emptyEl){ missedList._emptyEl.remove(); missedList._emptyEl = null; }
      missedList.hidden = false;
      missedList.innerHTML = missed.map(r=>
        `<div class="missed-item"><span class="en">${escapeHtml(r.en)}</span><span class="ja">${escapeHtml(r.ja)}</span></div>`
      ).join("");
    }

    const weakTotal = Object.keys(loadWeak()).length;
    weakTotalInfo.innerHTML = `現在の苦手リスト: <b>${weakTotal}</b>語(次回のセットで優先的に出題されます)`;

    showScreen("result");
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, ch=>({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[ch]));
  }

  /* ---------- wire up ---------- */
  startBtn.addEventListener("click", startGame);
  resetWeakBtn.addEventListener("click", resetWeakList);
  quitBtn.addEventListener("click", quitGame);
  backBtn.addEventListener("click", ()=>{ showScreen("setup"); updatePoolPreview(); });
  retryBtn.addEventListener("click", startGame);

  /* ---------- init ---------- */
  (function init(){
    ALL_WORDS = WORDS_DATA;
    buildFilterUI();
    updatePoolPreview();
  })();
})();
</script>
</body>
</html>
